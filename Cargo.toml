# The Orbit workspace. Crates are added as they earn their place; an empty crate is a
# promise, and this tree holds only things that run.
[workspace]
resolver = "3"
members = ["crates/orbit-core", "crates/orbit-daemon", "crates/orbit-macos"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
